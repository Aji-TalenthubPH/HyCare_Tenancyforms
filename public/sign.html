<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tenancy forms</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#14202b;--mute:#5c6b78;--line:#d9e0e7;--acc:#0f5f8a;--acc-ink:#fff;--soft:#e2eef5;--bad:#b3341f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--card:#18222c;--ink:#e8eef3;--mute:#9aabb9;--line:#2a3743;--acc:#5db3e3;--acc-ink:#07202e;--soft:#1c2f3d;--bad:#ff8f7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161d;--card:#18222c;--ink:#e8eef3;--mute:#9aabb9;--line:#2a3743;--acc:#5db3e3;--acc-ink:#07202e;--soft:#1c2f3d;--bad:#ff8f7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:920px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.7rem;line-height:1.15;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:0 0 4px;font-weight:600}
p{margin:0 0 12px}
.mute{color:var(--mute);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=text],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;background:var(--bg)}
.drop.over{border-color:var(--acc);background:var(--soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:20px}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--mute)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:700px}
th{text-align:left;font-weight:600;font-size:.85rem;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.orig{font-size:.8rem;color:var(--mute);word-break:break-all}
.badge{font-size:.75rem;background:var(--soft);color:var(--acc);border-radius:999px;padding:2px 8px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--card)}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.step{border-radius:999px;padding:5px 12px;font-size:.88rem;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.step.on{background:var(--soft);border-color:var(--acc);color:var(--ink);font-weight:600}
.field{margin-bottom:16px}
.field>label,.field>.lbl{display:block;font-weight:600;margin-bottom:5px}
.opt{display:flex;gap:8px;align-items:center;padding:4px 0;font-weight:400}
.opt input{width:18px;height:18px;accent-color:var(--acc)}
.msg{margin-top:12px;font-size:.92rem}
.msg.err{color:var(--bad)}
.ok-t{color:var(--acc)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}
.slot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px}
.slot span{font-weight:400;font-size:.88rem;color:var(--mute)}
.slot em{font-style:normal;font-size:.75rem;background:var(--soft);color:var(--acc);border-radius:999px;padding:2px 8px;margin-top:4px}
.slot[aria-pressed=true]{border:2px solid var(--acc);background:var(--soft)}
.irow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.irow .lbl{font-weight:600;margin-bottom:6px}
.cells{display:flex;flex-wrap:wrap;gap:8px}
.cell{flex:1 1 220px;min-width:0}
.cell.sm{flex:0 0 84px}
.cell span{display:block;font-size:.78rem;color:var(--mute);margin-bottom:2px}
.cell select,.cell input[type=text]{padding:6px 8px}
.sig{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.typeprev{font-family:"Dancing Script","Brush Script MT",cursive;font-weight:600;font-size:44px;line-height:1.3;min-height:64px;background:#fff;color:#111;border:1px dashed var(--line);border-radius:8px;padding:6px 12px;margin:8px 0;overflow:hidden;white-space:nowrap}
canvas.pad{display:block;width:100%;height:150px;background:#fff;border:1px dashed var(--line);border-radius:8px;touch-action:none;cursor:crosshair;margin-bottom:8px}
.sigimg{display:block;max-width:100%;height:90px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
#status.ok-t{display:none}
.req{color:var(--bad)}
input:disabled,select:disabled{opacity:.75;cursor:not-allowed}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<p class="mute" id="intro">Loading your form…</p>



<div class="msg" id="status" role="status"></div>

<div id="work" hidden>
  
  <section class="card" id="app"></section>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>let BUILTIN={};</script>
<script>
const {PDFDocument,PDFTextField,PDFCheckBox,PDFDropdown,PDFRadioGroup,PDFOptionList}=PDFLib;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROLES=[['all','Everyone'],['agent','Agent'],['manager','Manager'],['resident','Resident'],['staff','Agent or manager']];
const TYPES={text:'Text',check:'Checkbox',radio:'Choice',select:'Dropdown'};
let S={bytes:null,name:'form.pdf',fields:[],skipped:0,tab:'build',role:'manager',step:0,values:{},flat:false,slot:'r18',sigs:{},sigTime:{},consent:false,sigMode:{},sigText:{}};
const SLOTS=[['r18','Form R18','Rooming accommodation agreement'],['f1a','Form 1a','Entry condition report']];
const SIGN='Sign';
const SIGS={
  r18:[{k:'prov',label:'Provider, agent or manager',role:'staff',page:11,box:[23,491,207,530],date:'Date of signature (dd/mm/yyyy)1'},
       {k:'res1',label:'Resident 1',role:'resident',page:11,box:[23,621,207,660],date:'Date of signature (dd/mm/yyyy)2'},
       {k:'res2',label:'Resident 2',role:'resident',page:11,box:[23,751,207,790],date:'Date of signature (dd/mm/yyyy)3'}],
  f1a:[{k:'lessor',label:'Lessor or agent',role:'staff',page:8,box:[562,414,735,445],date:'Date of signature (dd/mm/yyyy) 1'},
       {k:'t1',label:'Tenant 1',role:'resident',page:8,box:[23,478,196,512],date:'Date of signature (dd/mm/yyyy) 2'},
       {k:'t2',label:'Tenant 2',role:'resident',page:8,box:[292,478,466,512],date:'Date of signature (dd/mm/yyyy) 3'},
       {k:'t3',label:'Tenant 3',role:'resident',page:8,box:[562,478,735,512],date:'Date of signature (dd/mm/yyyy) 4'}]
};
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
function stored(){return null}
function persist(){}
function applySaved(){
  let s=stored(S.slot);const bi=BUILTIN[S.slot];if(bi&&(!s||s.ver!==bi.ver))s=bi;
  if(!s||!s.tpl)return;
  const by={};S.fields.forEach(f=>by[f.name]=f);
  s.tpl.forEach(x=>{const f=by[x.name];if(f)Object.keys(x).forEach(k=>{if(k!=='name'&&x[k]!==undefined)f[k]=x[k]})});
  S.fields.sort((a,b)=>(a.ord??1e9)-(b.ord??1e9));
}
function renderChooser(){}

function pretty(n){return n.replace(/[_\-.\[\]()]+/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\s+/g,' ').trim().replace(/^./,c=>c.toUpperCase())||n}
function status(t,err){const el=$('#status');el.textContent=t;el.className='msg'+(err?' err':'')}

async function load(bytes,name){
  try{
    const doc=await PDFDocument.load(bytes,{ignoreEncryption:true});
    const pages=doc.getPages();const out=[];const values={};let skipped=0;
    doc.getForm().getFields().forEach(f=>{
      let type,options=[],val;
      if(f instanceof PDFTextField){type='text';val=f.getText()||''}
      else if(f instanceof PDFCheckBox){type='check';val=f.isChecked()}
      else if(f instanceof PDFRadioGroup){type='radio';options=f.getOptions();val=f.getSelected()||''}
      else if(f instanceof PDFDropdown||f instanceof PDFOptionList){type='select';options=f.getOptions();val=(f.getSelected()||[])[0]||''}
      else{skipped++;return}
      let pi=0;
      try{const w=f.acroField.getWidgets()[0];const r=w&&w.P();const i=pages.findIndex(p=>p.ref===r);if(i>-1)pi=i}catch(e){}
      const n=f.getName();
      out.push({name:n,type,options,label:pretty(n),step:'Page '+(pi+1),role:'all',include:true});
      values[n]=val;
    });
    S.bytes=bytes;S.name=name;S.fields=out;S.values=values;S.skipped=skipped;S.step=0;applySaved();
    if(!out.length){
      $('#work').hidden=true;
      status('No fillable fields found in this PDF. It may be a flat or scanned form. This prototype only works with PDFs that have built-in form fields.',true);
      return;
    }
    status('Found '+out.length+' fillable field'+(out.length>1?'s':'')+' in '+name+(skipped?' ('+skipped+' buttons or signature fields skipped)':'')+'.');
    $('#status').className='msg ok-t';
    $('#work').hidden=false;S.tab=BUILTIN[S.slot]?'fill':'build';render();persist(true);renderChooser();
  }catch(e){
    $('#work').hidden=true;
    status('Could not read this file. Make sure it is a PDF and is not password-protected.',true);
  }
}

async function makeSample(){
  const doc=await PDFDocument.create();const form=doc.getForm();
  const p=doc.addPage([595,500]);
  p.drawText('Sample accommodation form',{x:50,y:450,size:18});
  const t=(n,y)=>{const f=form.createTextField(n);f.addToPage(p,{x:50,y,width:300,height:22})};
  t('resident_full_name',400);t('residentAddress',360);t('provider.name',320);
  const cb=form.createCheckBox('agrees_to_terms');cb.addToPage(p,{x:50,y:280,width:16,height:16});
  const dd=form.createDropdown('room_type');dd.addOptions(['Single','Shared','Ensuite']);dd.addToPage(p,{x:50,y:240,width:200,height:22});
  const rg=form.createRadioGroup('payment_method');['Weekly','Fortnightly','Monthly'].forEach((o,i)=>{rg.addOptionToPage(o,p,{x:50+i*40,y:200,width:16,height:16})});
  const p2=doc.addPage([595,500]);
  const f2=form.createTextField('emergency_contact');f2.addToPage(p2,{x:50,y:400,width:300,height:22});
  const f3=form.createTextField('emergencyPhone');f3.addToPage(p2,{x:50,y:360,width:300,height:22});
  return doc.save();
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  $('#app').innerHTML=S.tab==='build'?viewBuild():viewFill();
  if(S.tab==='fill'){initPads();lockUi()}
}
function viewBuild(){
  const rows=S.fields.map((f,i)=>`<tr>
    <td><input type="checkbox" data-i="${i}" data-k="include" ${f.include?'checked':''} aria-label="Include ${esc(f.label)}"></td>
    <td><div class="orig">${esc(f.name)}</div><span class="badge">${TYPES[f.type]}</span></td>
    <td><input type="text" data-i="${i}" data-k="label" value="${esc(f.label)}" aria-label="Label for ${esc(f.name)}"></td>
    <td><input type="text" data-i="${i}" data-k="step" value="${esc(f.step)}" aria-label="Step for ${esc(f.name)}"></td>
    <td><select data-i="${i}" data-k="role" aria-label="Who sees ${esc(f.name)}">${ROLES.map(r=>`<option value="${r[0]}" ${f.role===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select></td>
  </tr>`).join('');
  return `<h2>Set up this form once</h2>
  <p class="mute">Give each field a plain label, put it in a step, and choose who sees it. Fields start grouped by PDF page.</p>
  <div class="scroll"><table><thead><tr><th>Use</th><th>Field in PDF</th><th>Question shown</th><th>Step</th><th>Shown to</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="row" style="margin-top:16px">
    <button class="primary" data-act="tofill">Preview and fill</button>
  </div>
  <div class="msg" id="tplmsg"></div>`;
}
function visible(){return S.fields.filter(f=>f.include&&(LOCKED.has(f.name)?!isEmpty(S.values[f.name]):(f.role==='all'||f.role===MYROLE)))}
function ctl(f,i,v){
  if(f.type==='text')return f.ui==='yn'?`<select data-f="${i}"><option value=""></option><option ${v==='Y'?'selected':''}>Y</option><option ${v==='N'?'selected':''}>N</option></select>`:`<input type="text" data-f="${i}" value="${esc(v)}">`;
  if(f.type==='radio')return f.options.map(o=>`<label class="opt"><input type="radio" name="r${i}" data-f="${i}" value="${esc(o)}" ${v===o?'checked':''}> ${esc(o)}</label>`).join('');
  return `<select data-f="${i}"><option value="">Select…</option>${f.options.map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
}
function renderItems(list){
  let out='',seen={},k=0;
  while(k<list.length){
    const f=list[k],i=S.fields.indexOf(f);
    if(f.group){
      if(!seen[f.group]){seen[f.group]=1;
        const mem=list.filter(x=>x.group===f.group);
        out+=`<div class="field"><div class="lbl">${esc(f.gl||f.label)}</div><div class="row">${mem.map(m=>`<label class="opt"><input type="checkbox" data-f="${S.fields.indexOf(m)}" ${S.values[m.name]?'checked':''}> ${esc(m.opt||m.label)}</label>`).join('')}</div></div>`}
      k++;continue;
    }
    if(f.rid){
      const mem=[];while(k<list.length&&list[k].rid===f.rid&&!list[k].group){mem.push(list[k]);k++}
      out+=`<div class="irow"><div class="lbl">${esc(f.rl)}</div><div class="cells">${mem.map(m=>`<div class="cell ${m.ui==='yn'?'sm':''}"><span>${esc(m.label)}</span>${ctl(m,S.fields.indexOf(m),S.values[m.name])}</div>`).join('')}</div></div>`;
      continue;
    }
    const v=S.values[f.name];
    out+=f.type==='check'?`<div class="field"><label class="opt"><input type="checkbox" data-f="${i}" ${v?'checked':''}> <span style="font-weight:600">${esc(f.label)}${isReq(f)?' *':''}</span></label></div>`:`<div class="field"><div class="lbl">${esc(f.label)}${isReq(f)?' <span class="req">*</span>':''}</div>${ctl(f,i,v)}</div>`;
    k++;
  }
  return out;
}
function p2(n){return String(n).padStart(2,'0')}
function stamp(iso){const d=new Date(iso);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function sigSlots(){return (SIGS[S.slot]||[]).filter(s=>s.role===MYROLE).slice(0,1)}
function sigPad(s){
  const k=s.k,m=S.sigMode[k]||'draw';
  const seg=`<div class="seg" style="margin-bottom:8px" role="group" aria-label="Signature method"><button data-act="sigmode" data-k="${k}" data-v="draw" aria-pressed="${m==='draw'}">Draw</button><button data-act="sigmode" data-k="${k}" data-v="type" aria-pressed="${m==='type'}">Type</button></div>`;
  if(m==='type')return seg+`<input type="text" maxlength="40" data-t="${k}" placeholder="Type your full name" value="${esc(S.sigText[k]||'')}" aria-label="Type your name to sign"><div class="typeprev" id="tp-${k}">${esc(S.sigText[k]||'')}</div><div class="row"><button class="primary" data-act="sigsave" data-k="${k}">Save signature</button></div>`;
  return seg+`<canvas class="pad" data-k="${k}" aria-label="Signature box for ${esc(s.label)}"></canvas><div class="row"><button class="primary" data-act="sigsave" data-k="${k}">Save signature</button><button data-act="sigclear" data-k="${k}">Clear</button></div>`;
}
function textSig(t){
  const c=document.createElement('canvas'),f='600 72px "Dancing Script","Brush Script MT",cursive';
  let x=c.getContext('2d');x.font=f;const w=Math.ceil(x.measureText(t).width)+24;
  c.width=Math.min(w,2000);c.height=130;x=c.getContext('2d');x.font=f;x.fillStyle='#111';x.textBaseline='middle';x.fillText(t,12,68);
  return cropPad(c);
}
function viewSign(sl){
  const rows=sl.map(s=>{const d=S.sigs[s.k];
    return `<div class="sig"><div class="lbl">${esc(s.label)}</div>`+(d
      ?`<img src="${d}" alt="Signature of ${esc(s.label)}" class="sigimg"><div class="mute" style="margin:6px 0">Signed ${stamp(S.sigTime[s.k])}</div><button data-act="sigremove" data-k="${s.k}">Remove signature</button>`
      :sigPad(s))+`</div>`}).join('');
  return `<p class="mute">Draw your signature, or type your name to sign. It is added to the PDF with the date and time.</p>
  <label class="opt"><input type="checkbox" id="consent" ${S.consent?'checked':''}> I agree to sign this form electronically.</label>${rows}<div class="msg" id="sigmsg" role="status"></div>`;
}
function initPads(){
  document.querySelectorAll('canvas.pad').forEach(cv=>{
    const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
    cv.width=w*dpr;cv.height=h*dpr;
    const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
    let down=false;
    const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
    cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke()};
    cv.onpointermove=e=>{if(!down)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()};
    cv.onpointerup=cv.onpointercancel=()=>{down=false};
  });
}
function cropPad(cv){
  const w=cv.width,h=cv.height,d=cv.getContext('2d').getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return null;
  const p=6,cw=x1-x0+1,ch=y1-y0+1,c=document.createElement('canvas');c.width=cw+p*2;c.height=ch+p*2;
  c.getContext('2d').drawImage(cv,x0,y0,cw,ch,p,p,cw,ch);return c.toDataURL('image/png');
}
async function sigSave(k){
  const m=$('#sigmsg');
  if(!S.consent){m.className='msg err';m.textContent='Tick the box to agree to sign electronically.';return}
  let d=null;
  if(S.sigMode[k]==='type'){
    const t=(S.sigText[k]||'').trim();
    if(!t){m.className='msg err';m.textContent='Type your name first.';return}
    try{await document.fonts.load('600 72px "Dancing Script"')}catch(e){}
    d=textSig(t);
  }else{
    const cv=document.querySelector('canvas.pad[data-k="'+k+'"]');d=cv&&cropPad(cv);
    if(!d){m.className='msg err';m.textContent='Draw your signature in the box first.';return}
  }
  const s=(SIGS[S.slot]||[]).find(x=>x.k===k),now=new Date();
  S.sigs[k]=d;S.sigTime[k]=now.toISOString();
  if(s&&s.date)S.values[s.date]=p2(now.getDate())+'/'+p2(now.getMonth()+1)+'/'+now.getFullYear();
  render();
}
function sigClear(k){const cv=document.querySelector('canvas.pad[data-k="'+k+'"]');if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height)}
function sigRemove(k){delete S.sigs[k];delete S.sigTime[k];render()}
async function stampSigs(doc){
  const list=SIGS[S.slot]||[];if(!list.some(s=>S.sigs[s.k]))return;
  const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  for(const s of list){
    const d=S.sigs[s.k];if(!d)continue;
    const pg=doc.getPages()[s.page-1],H=pg.getHeight(),img=await doc.embedPng(d);
    const [x0,top,x1,bot]=s.box,ix=x0+40,iw=x1-3-ix,it=top+2,ih=bot-9-it;
    const sc=Math.min(iw/img.width,ih/img.height),w=img.width*sc,hh=img.height*sc;
    pg.drawImage(img,{x:ix+(iw-w)/2,y:H-(it+(ih-hh)/2)-hh,width:w,height:hh});
    pg.drawText('Signed electronically '+stamp(S.sigTime[s.k]),{x:x0+3,y:H-(bot-3),size:5.5,font,color:PDFLib.rgb(.35,.35,.35)});
  }
}
function viewFill(){
  const vis=visible();
  const steps=[...new Set(vis.map(f=>f.step.trim()||'Details'))];
  if(sigSlots().length)steps.push(SIGN);
  if(S.step>=steps.length)S.step=Math.max(0,steps.length-1);
  const cur=steps[S.step];
  const head=`<h2>Fill: ${esc(S.slot==='other'?S.name:SLOTS.find(x=>x[0]===S.slot)[1])}</h2>
  `;
  if(!vis.length)return head+'<p class="mute">No questions are shown to this role. Change the setup or pick another role.</p>';
  const items=cur===SIGN?viewSign(sigSlots()):renderItems(vis.filter(f=>(f.step.trim()||'Details')===cur));
  const last=S.step===steps.length-1;
  return head+`<div class="steps">${steps.map((s,i)=>`<button class="step ${i===S.step?'on':''}" data-act="goto" data-v="${i}">${esc(s)}</button>`).join('')}</div>
  ${items}
  <div class="row" style="margin-top:14px">
    <button data-act="back" ${S.step===0?'disabled':''}>Back</button>
    ${last?'<button class="primary" data-act="finish">Finish and send</button>':'<button class="primary" data-act="next">Next</button>'}
  </div><div class="msg" id="fillmsg"></div>`;
}

/* ---------- actions ---------- */
async function save(filename,data){
  let dl=null;
  try{if(typeof claude!=='undefined')dl=await claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename,data});return 'ok'}catch(e){return e&&e.code==='declined'?'declined':'unavailable'}}
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:'application/json'});
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);return 'ok';
  }catch(e){return 'unavailable'}
}
async function download(){
  const m=$('#fillmsg');m.className='msg';m.textContent='Building PDF…';
  try{
    const doc=await PDFDocument.load(S.bytes,{ignoreEncryption:true});const form=doc.getForm();let bad=0;
    for(const f of S.fields){
      try{
        const fld=form.getField(f.name),v=S.values[f.name];
        if(f.type==='text')fld.setText(v||'');
        else if(f.type==='check'){v?fld.check():fld.uncheck()}
        else if(v){fld.select(v)}
      }catch(e){bad++}
    }
    if(S.flat)form.flatten();
    await stampSigs(doc);
    const bytes=await doc.save();
    const r=await save(S.name.replace(/\.pdf$/i,'')+'-filled.pdf',new Blob([bytes],{type:'application/pdf'}));
    if(r==='ok'){m.className='msg ok-t';m.textContent='Saved.'+(bad?' '+bad+' field(s) could not be filled (unsupported characters or length).':'')}
    else if(r==='declined'){m.textContent='Download cancelled.'}
    else{m.className='msg err';m.textContent='Downloads are not available in this view. Open the page from its claude.ai link to download.'}
  }catch(e){m.className='msg err';m.textContent='Could not build the PDF: '+(e.message||e)}
}
async function saveTpl(){
  const tpl={pdf:S.name,fields:S.fields.map(({name,label,step,role,include})=>({name,label,step,role,include}))};
  const r=await save(S.name.replace(/\.pdf$/i,'')+'-setup.json',JSON.stringify(tpl,null,2));
  const m=$('#tplmsg');m.className=r==='ok'?'msg ok-t':'msg err';
  m.textContent=r==='ok'?'Setup saved. Load it later with any copy of this form.':r==='declined'?'Save cancelled.':'Saving is not available in this view.';
}
function applyTpl(txt){
  const m=$('#tplmsg');
  try{
    const t=JSON.parse(txt);let n=0;
    (t.fields||[]).forEach(x=>{const f=S.fields.find(f=>f.name===x.name);if(f){['label','step','role','include'].forEach(k=>{if(k in x)f[k]=x[k]});n++}});
    render();persist();const mm=$('#tplmsg');mm.className=n?'msg ok-t':'msg err';
    mm.textContent=n?'Applied setup to '+n+' matching field(s).':'No field names in that file match this PDF.';
  }catch(e){m.className='msg err';m.textContent='That file is not a valid setup file.'}
}

/* ---------- events ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
$('#app').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.i!==undefined){S.fields[+t.dataset.i][t.dataset.k]=t.type==='checkbox'?t.checked:t.value;clearTimeout(S.pt);S.pt=setTimeout(()=>persist(),500)}
  else if(t.dataset.f!==undefined){const f=S.fields[+t.dataset.f];const v=t.type==='checkbox'?t.checked:t.value;S.values[f.name]=v;
    if(f.mirror)S.fields.forEach(x=>{if(x.mirror===f.mirror)S.values[x.name]=v});
    if(f.group&&v){S.fields.forEach(x=>{if(x.group===f.group&&x!==f)S.values[x.name]=false});render()}}
  else if(t.dataset.t!==undefined){S.sigText[t.dataset.t]=t.value;const pv=document.getElementById('tp-'+t.dataset.t);if(pv)pv.textContent=t.value}
  else if(t.id==='flat'){S.flat=t.checked}
  else if(t.id==='consent'){S.consent=t.checked}
  else if(t.id==='tplfile'&&t.files[0]){t.files[0].text().then(applyTpl);t.value=''}
});
$('#app').addEventListener('change',e=>{if(e.target.id==='tplfile'&&e.target.files[0]){e.target.files[0].text().then(applyTpl);e.target.value=''}});
$('#app').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='tofill'){S.tab='fill';S.step=0;render()}
  else if(a==='role'){S.role=b.dataset.v;S.step=0;render()}
  else if(a==='goto'){S.step=+b.dataset.v;render()}
  else if(a==='next'){S.step++;render()}
  else if(a==='back'){S.step=Math.max(0,S.step-1);render()}
  else if(a==='sigmode'){S.sigMode[b.dataset.k]=b.dataset.v;render()}
  else if(a==='sigsave')sigSave(b.dataset.k);
  else if(a==='sigclear')sigClear(b.dataset.k);
  else if(a==='sigremove')sigRemove(b.dataset.k);
  else if(a==='finish')finish();
  else if(a==='saveTpl')saveTpl();
  else if(a==='loadTpl')$('#tplfile').click();
});

/* ---------- signing-link logic ---------- */
let TOKEN='',MYROLE='resident',LOCKED=new Set(),REQ=new Set();
const isEmpty=v=>v===undefined||v===null||v===''||v===false;
const isReq=f=>REQ.has(f.name)&&!LOCKED.has(f.name)&&(f.role===MYROLE||(f.role==='all'&&MYROLE==='resident'));
function lockUi(){document.querySelectorAll('[data-f]').forEach(el=>{const f=S.fields[+el.dataset.f];if(f&&LOCKED.has(f.name))el.disabled=true})}
async function init(){
  TOKEN=new URLSearchParams(location.search).get('t')||'';
  const fail=m=>{$('#work').hidden=true;$('#intro').textContent='';status(m,true)};
  if(!TOKEN)return fail('This link is missing its code. Please use the link from your email.');
  let job;
  try{const r=await fetch('/.netlify/functions/get-job?t='+encodeURIComponent(TOKEN));job=await r.json();if(!r.ok)return fail(job.error||'This link cannot be opened.')}
  catch(e){return fail('Could not reach the server. Check your connection and try again.')}
  MYROLE=job.role;S.role=job.role==='staff'?'manager':'resident';
  LOCKED=new Set(job.lockedFields||[]);REQ=new Set(job.requiredFields||[]);
  try{
    const tpl=await (await fetch('/forms/'+job.form+'.json')).json();
    BUILTIN[job.form]={ver:1,tpl};S.slot=job.form;
    const bytes=new Uint8Array(await (await fetch(job.pdfUrl)).arrayBuffer());
    await load(bytes,job.form+'.pdf');
    Object.assign(S.values,job.answers||{});
    $('#intro').textContent=(job.role==='staff'?'Please complete your part and sign.':'Please fill in your details and sign.')+' Fields marked * are required.';
    S.tab='fill';S.step=0;render();
  }catch(e){fail('Could not load the form. Please try again.')}
}
async function finish(){
  const say=(t,err=true)=>{const m=$('#fillmsg')||$('#sigmsg');if(m){m.className='msg'+(err?' err':'');m.textContent=t}};
  const own=visible().filter(f=>!LOCKED.has(f.name));
  const miss=own.filter(f=>isReq(f)&&isEmpty(S.values[f.name]));
  const steps=[...new Set(visible().map(f=>f.step.trim()||'Details'))];
  if(miss.length){S.step=steps.indexOf(miss[0].step.trim()||'Details');render();
    say('Please complete the required fields (*): '+miss.slice(0,5).map(f=>f.label).join(', ')+(miss.length>5?' and '+(miss.length-5)+' more':'')+'.');return}
  const sl=sigSlots()[0];
  if(!sl||!S.sigs[sl.k]){S.step=steps.length;render();say('Add your signature, then press Finish and send.');return}
  const names=new Set(own.map(f=>f.name));
  S.fields.forEach(x=>{if(x.mirror&&own.some(o=>o.mirror===x.mirror))names.add(x.name)});
  const answers={};names.forEach(n=>{if(S.values[n]!==undefined)answers[n]=S.values[n]});
  const btn=document.querySelector('[data-act=finish]');if(btn)btn.disabled=true;say('Sending…',false);
  try{
    const r=await fetch('/.netlify/functions/complete-signer',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:TOKEN,answers,signaturePng:S.sigs[sl.k],consent:true})});
    const j=await r.json();
    if(!r.ok){if(btn)btn.disabled=false;return say(j.error||'Something went wrong. Please try again.')}
    if(j.nextLink){$('#work').hidden=true;$('#intro').textContent='';status('Test mode: next signer link is '+j.nextLink,false);$('#status').className='msg';return}
    location.href='done.html';
  }catch(e){if(btn)btn.disabled=false;say('Could not send. Check your connection and try again.')}
}
init();
</script>
